name: CI

on:
  push:
    branches: [main, beta, 'next-*']
  pull_request:
    branches: [main, beta, 'next-*']

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FFMPEG_DL_SERVER: ${{ secrets.FFMPEG_DL_SERVER }}

jobs:
  typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          # Electron (Chromium runtime) is a devDependency; still audit it.
          npm audit --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and run tests
        run: npm run tests

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Config and syntax checks
        run: npm run test:checks

  build:
    name: Build + Package Smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare FFmpeg payload for package smoke
        run: npm run ci:prepare-ffmpeg

      - name: Build
        run: npm run build

      # Runs the real conversion presets against the bundled FFmpeg. Self-skips
      # when the payload is the placeholder used for untrusted builds, and is
      # enforced on trusted branches where the real payload is available.
      - name: FFmpeg integration tests
        env:
          # ci:prepare-ffmpeg installs a checksum-verified payload whenever the
          # download secret is configured, so that is exactly when these tests
          # must not be allowed to silently skip.
          CONV2_REQUIRE_FFMPEG_TESTS: ${{ secrets.FFMPEG_DL_SERVER != '' && '1' || '0' }}
        run: npm run test:ffmpeg

      - name: Runtime smoke (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:runtime -- --skip-compile

      - name: Runtime smoke
        if: runner.os != 'Linux'
        run: npm run smoke:runtime -- --skip-compile

      - name: Generate license manifest
        run: npm run licenses

      - name: Package smoke (Linux AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Package smoke (Windows NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never

      - name: Package smoke (macOS DMG)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg -c.mac.notarize=false --publish never

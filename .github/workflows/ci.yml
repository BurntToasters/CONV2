name: CI

on:
  push:
    branches: [main, beta, 'next-*']
  pull_request:
    branches: [main, beta, 'next-*']

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Public release pinned to resources/ffmpeg/checksums.json. GitHub-hosted
  # runners cannot resolve the intranet download host.
  FFMPEG_DL_SERVER: https://github.com/BurntToasters/ffmpeg-static-builds/releases/download/ffmpeg-v9.0.2

jobs:
  typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Comment lint
        run: npm run lint

      - name: Run TypeScript compiler
        run: npm run typecheck

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          # Dev tooling is not shipped; critical findings still fail CI.
          npm audit --audit-level=critical

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/ffmpeg/linux
            resources/ffmpeg/win
            resources/ffmpeg/mac
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('resources/ffmpeg/checksums.json') }}

      - name: Prepare FFmpeg payload
        run: npm run ci:prepare-ffmpeg

      - name: Build and run tests
        run: npm run tests

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Config and syntax checks
        run: npm run test:checks

  build:
    name: Build + Package Smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/ffmpeg/linux
            resources/ffmpeg/win
            resources/ffmpeg/mac
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('resources/ffmpeg/checksums.json') }}

      - name: Prepare FFmpeg payload for package smoke
        run: npm run ci:prepare-ffmpeg

      - name: Build
        run: npm run build

      # Runs the real conversion presets against the bundled FFmpeg. Self-skips
      # when the payload is the placeholder used for untrusted builds, and is
      # enforced on trusted branches where the real payload is available.
      - name: FFmpeg integration tests
        env:
          # ci:prepare-ffmpeg installs the checksum-verified public payload.
          CONV2_REQUIRE_FFMPEG_TESTS: '1'
        run: npm run test:ffmpeg

      - name: Runtime smoke (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:runtime -- --skip-compile

      - name: Runtime smoke
        if: runner.os != 'Linux'
        run: npm run smoke:runtime -- --skip-compile

      - name: Generate license manifest
        run: npm run licenses

      - name: Package smoke (Linux AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Package smoke (Windows NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never

      - name: Package smoke (macOS DMG)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg -c.mac.notarize=false --publish never

      - name: Verify packaged app contents
        run: node build-scripts/verify-package-contents.js release

      - name: Upload package contents report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-contents-${{ runner.os }}
          path: coverage/e2e/package-contents.json
          if-no-files-found: warn

  e2e:
    name: E2E (UI + conversion matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/ffmpeg/linux
            resources/ffmpeg/win
            resources/ffmpeg/mac
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('resources/ffmpeg/checksums.json') }}

      - name: Prepare FFmpeg payload
        run: npm run ci:prepare-ffmpeg

      # Skips when no runnable FFmpeg exists (untrusted PRs); required when the payload is available.
      - name: E2E (headless)
        if: runner.os == 'Linux'
        env:
          CONV2_REQUIRE_FFMPEG_TESTS: '1'
        run: xvfb-run -a npm run test:e2e

      - name: E2E
        if: runner.os != 'Linux'
        env:
          CONV2_REQUIRE_FFMPEG_TESTS: '1'
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ runner.os }}
          path: coverage/e2e/
          if-no-files-found: warn

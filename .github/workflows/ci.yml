name: CI

on:
  push:
    branches: [main, beta, 'next-*']
  pull_request:
    branches: [main, beta, 'next-*']

permissions:
  contents: read

env:
  NODE_VERSION: '26.13.0'
  NPM_VERSION: '12.2.1'
  # Real FFmpeg payloads are not published for GitHub-hosted runners yet.
  # ci:prepare-ffmpeg skips the download, and payload tests skip with it.

jobs:
  typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized version files
        run: npm run sync-version && git diff --exit-code

      - name: Check formatting
        run: npm run format:check

      - name: Comment lint
        run: npm run lint

      - name: Run TypeScript compiler
        run: npm run typecheck

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          # Dev tooling is not shipped; critical findings still fail CI.
          npm audit --audit-level=critical

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare FFmpeg payload
        run: npm run ci:prepare-ffmpeg

      - name: Build and run tests
        run: npm run tests

      # Authenticode tests skip without osslsigncode, which drops ffmpegIntegrity coverage.
      - name: Install osslsigncode
        run: |
          sudo apt-get update
          sudo apt-get install -y osslsigncode

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Config and syntax checks
        run: npm run test:checks

  build:
    name: Build + Package Smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prepare FFmpeg payload for package smoke
        run: npm run ci:prepare-ffmpeg

      - name: Build
        run: npm run build

      # Skips until a bundled FFmpeg payload is available on the runner.
      - name: FFmpeg integration tests
        run: npm run test:ffmpeg

      - name: Runtime smoke (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:runtime -- --skip-compile

      - name: Runtime smoke
        if: runner.os != 'Linux'
        run: npm run smoke:runtime -- --skip-compile

      - name: Generate license manifest
        run: npm run licenses

      - name: Package smoke (Linux AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Package smoke (Windows NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never

      - name: Package smoke (macOS DMG)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg -c.mac.notarize=false --publish never

      - name: Verify packaged app contents
        run: node build-scripts/verify-package-contents.js release

      - name: Verify packaged FFmpeg
        run: node build-scripts/verify-packaged-ffmpeg.js release

      - name: Upload package contents report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-contents-${{ runner.os }}
          path: coverage/e2e/package-contents.json
          if-no-files-found: warn

  e2e:
    name: E2E (UI + conversion matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Skips conversion coverage when the runner has no bundled FFmpeg.
      - name: E2E (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: E2E
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ runner.os }}
          path: coverage/e2e/
          if-no-files-found: warn

  stable-metadata:
    name: Stable promotion metadata only
    # A release/* branch promoted to main must remove only the beta suffix and
    # touch exactly the synchronized release metadata set.
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        startsWith(github.head_ref, 'release/')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce stable metadata-only promotion
        run: >-
          node build-scripts/check-stable-metadata-pr.js
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

name: CI

# Pull requests prove candidate changes. Pushes prove the exact post-merge tips
# of the protected release branches without duplicating every PR branch update.
# Jobs run tests, not signed release artifacts (never npm run release:*).

on:
  push:
    branches: [main, beta, "next-*"]
  pull_request:
    branches: [main, beta, "next-*"]

permissions:
  contents: read

# A newer push supersedes the running check, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "26.13.0"
  NPM_VERSION: "12.2.1"
  # Real FFmpeg payloads download from FFMPEG_DL_SERVER (repo secret). When the
  # secret is absent, scripts/ci-ffmpeg.cjs skips the download loudly and the
  # payload checks skip with it; trusted pushes fail hard instead.

jobs:
  commit-message-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enforce Co-authored-by email policy
        run: node scripts/strip-coauthor-trailers.js --check-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: Enforce stable metadata-only main PR
        if: >-
          ${{
            github.event.pull_request.base.ref == 'main' &&
            startsWith(github.head_ref, 'release/')
          }}
        run: >-
          node scripts/check-stable-metadata-pr.mjs
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/rust-toolchain.mjs)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate the bundled FFmpeg payload
        env:
          FFMPEG_DL_SERVER: ${{ secrets.FFMPEG_DL_SERVER }}
        run: node scripts/ci-ffmpeg.cjs

      - name: Prepare Rust test sidecars
        run: npm run prepare:rust-tests

      - name: Run TypeScript compiler
        run: npm run typecheck

      - name: Comment lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run vitest
        run: npm run test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Validate changelog version
        run: npm run validate:changelog

      - name: Validate no em-dash
        run: npm run validate:no-em-dash

      - name: Cargo/npm safe-update acceptance
        run: npm run test:cargo-safe-update

  updater-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - name: Validate updater manifests
        run: npm run validate:updater
      # Read-only shape smoke. Exact candidate version is checked after publish
      # by release:verify:published; requiring it here makes version bumps
      # circular because build VMs cannot publish until this CI passes.
      - name: Published updater feed sanity
        run: npm run validate:updater:live

  ci-gate:
    if: ${{ always() }}
    needs:
      - commit-message-policy
      - quality-gate
      - updater-manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE_POLICY: ${{ needs.commit-message-policy.result }}
          QUALITY_GATE: ${{ needs.quality-gate.result }}
          UPDATER_MANIFEST: ${{ needs.updater-manifest.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_GATE" = success
          test "$UPDATER_MANIFEST" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$COMMIT_MESSAGE_POLICY" = success
          else
            test "$COMMIT_MESSAGE_POLICY" = skipped
          fi
